[package]
name = "syslogcat"
version = "0.1.0"
edition = "2021"
description = "A fast, standalone RFC 5424 & RFC 3164 Syslog receiver, parser, filter, and stream processor (UDP & TCP)"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/syslogcat"
readme = "README.md"
keywords = ["syslog", "rfc5424", "rfc3164", "logging", "network"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "syslogcat"
path = "src/lib.rs"

[[bin]]
name = "syslogcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
